[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-datadir-nng"
description = "Fixtures for pytest allowing test functions/methods to easily retrieve test resources from the local filesystem."
readme = "README.md"
authors = [{ name = "jdidion", email = "github@didion.net" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["pytest>=7.0.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/jdidion/pytest-datadir-nng"
Repository = "https://github.com/jdidion/pytest-datadir-nng"

[project.entry-points.pytest11]
pytest_datadir_nng = "pytest_datadir_nng"

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]

[tool.setuptools]
packages = ["pytest_datadir_nng"]

[tool.setuptools_scm]
fallback_version = "1.1.1"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["pytest_datadir_nng"]
branch = true

[tool.coverage.report]
show_missing = true
